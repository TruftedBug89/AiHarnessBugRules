[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-harness-rules"
version = "0.1.0"
description = "CLI tool to validate agent configurations against AiHarnessBugRules."
requires-python = ">=3.8"
dependencies = [
    "pyyaml"
]

[project.scripts]
ai-harness-rules = "ai_harness_rules.cli:main"
